<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>diddys playhouse - Games</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-particles"></div>
    <div class="background-glow"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">⚡</span>
<span class="logo-text">diddys playhouse</span>
            </div>
            <div class="nav-controls">
                <div class="theme-dropdown">
                    <button class="theme-btn" id="themeBtn" title="Change Theme">🎨</button>
                    <div class="theme-menu" id="themeMenu"></div>
                </div>
                <a href="home.html" class="nav-link">🏠 Home</a>
                <a href="favorites.html" class="nav-link">
                    ❤️ Favorites
                    <span id="favoritesBadge" class="fav-badge" style="display:none;">0</span>
                </a>

<a href="chat.html" class="nav-link">💬 Chat</a>
                <a href="ai.html" class="nav-link">🤖 AI</a>
                <a href="ideas.html" class="nav-link">💡 Ideas</a>
                <a href="music.html" class="nav-link">🎵 Music</a>
                <a href="admin.html" class="nav-link">🔧 Admin</a>


                <button class="logout-btn" onclick="logout()">Logout</button>

            </div>
        </div>
    </nav>

    <!-- Continue Playing Section -->
    <section class="recently-played-section continue-playing-section" id="recentSection" style="display:none;">
        <h2 class="section-title">▶️ Continue Playing</h2>
        <div class="recently-played-grid" id="recentGames">
            <p class="continue-empty" style="text-align: center; color: var(--text-secondary); grid-column: 1/-1; padding: 2rem;">No games played yet. Start playing!</p>
        </div>
    </section>

    <!-- Games Section -->
    <section class="games-section">
        <div class="games-section-header">
            <h1 class="section-title">🎮 All Games</h1>
            <button class="random-wheel-btn" id="randomWheelBtn" title="Random Game Wheel">
                🎡 Random Game
            </button>
        </div>



        <div class="games-grid" id="gamesGrid">
            <!-- Games will be generated by JavaScript -->
        </div>





    </section>

    <!-- Random Game Wheel Modal -->
    <div id="randomWheelModal" class="wheel-modal">
        <div class="wheel-modal-content">
            <div class="wheel-modal-header">
                <h2>🎡 Random Game Wheel</h2>
                <button class="wheel-close" id="wheelCloseBtn">✕</button>
            </div>
            <p class="wheel-subtitle">Spin the wheel and it will pick a random game for you!</p>
            <div class="wheel-wrapper">
                <div class="wheel-pointer"></div>
                <div class="wheel" id="randomWheel">
                    <div class="wheel-center" id="wheelCenter">🎮</div>
                </div>
            </div>
            <button class="wheel-spin-btn" id="wheelSpinBtn">🎰 Spin the Wheel</button>
        </div>
    </div>

    <!-- Color Customizer Modal -->
    <div id="customizerModal" class="customizer-modal">
        <div class="customizer-content">
            <div class="customizer-header">
                <h2>🎨 Customize Theme</h2>
                <button class="customizer-close">✕</button>
            </div>
            
            <div class="color-picker-group">
                <label class="color-picker-label">Primary Color (Accents & Glow)</label>
                <div class="color-input-wrapper">
                    <input type="color" id="primaryColorInput" class="color-input" data-color-input="primary">
                    <div class="color-value" id="primaryDisplay">#00d9ff</div>
                </div>
            </div>

            <div class="color-picker-group">
                <label class="color-picker-label">Secondary Color (Highlights)</label>
                <div class="color-input-wrapper">
                    <input type="color" id="secondaryColorInput" class="color-input" data-color-input="secondary">
                    <div class="color-value" id="secondaryDisplay">#ff006e</div>
                </div>
            </div>

            <div class="color-picker-group">
                <label class="color-picker-label">Green Accent</label>
                <div class="color-input-wrapper">
                    <input type="color" id="greenColorInput" class="color-input" data-color-input="green">
                    <div class="color-value" id="greenDisplay">#39ff14</div>
                </div>
            </div>

            <div class="color-picker-group">
                <label class="color-picker-label">Purple Accent</label>
                <div class="color-input-wrapper">
                    <input type="color" id="purpleColorInput" class="color-input" data-color-input="purple">
                    <div class="color-value" id="purpleDisplay">#b366ff</div>
                </div>
            </div>

            <div class="customizer-actions">
                <button class="customizer-btn customizer-save">💾 Save Theme</button>
                <button class="customizer-btn customizer-reset">🔄 Reset</button>
            </div>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="auth.js"></script>
    <script src="ads.js"></script>
    <script src="favorites.js"></script>
<script src="games/script.js"></script>
    <script src="wheel.js"></script>
    <script src="panic.js"></script>

    <script>
        // Example sponsor boxes (replace the old quick button)
        (function () {
            if (document.getElementById('sponsorExampleBox')) return;

            var wrap = document.createElement('div');
            wrap.id = 'sponsorExampleBox';
            wrap.style.position = 'fixed';
            wrap.style.top = '140px';
            wrap.style.right = '16px';


            wrap.style.zIndex = '200001';

            wrap.style.width = '260px';
            wrap.style.pointerEvents = 'auto';

            wrap.innerHTML = [
              '<div style="margin-bottom:10px; padding:12px; border-radius:12px; background:rgba(10,14,39,0.88); border:1px solid rgba(0,217,255,0.25); backdrop-filter:blur(10px); box-shadow:0 10px 30px rgba(0,0,0,0.35);">',
              '<div style="color:#fff; font-weight:900; font-size:14px; margin-bottom:6px;">Do you want your ad here?</div>',
              '<a href="sponsor.html" target="_blank" rel="noopener noreferrer" style="display:inline-block; color:var(--primary-color); font-weight:800; text-decoration:none;">Click here to learn more →</a>',
              '</div>',
            ].join('');


            document.body.appendChild(wrap);

        })();
    </script>
</body>
</html>
