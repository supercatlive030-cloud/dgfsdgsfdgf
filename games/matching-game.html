<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS3 Matching Game - Unblocked Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { color: #fff; }
    .matching-game-page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #08121f;
    }
    #game-wrapper {
      width: 100%;
      max-width: 880px;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game { margin: 0 auto; position: relative; }
    #popup { z-index: 2; }
    .home-btn {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      text-decoration: none;
      background: rgba(10, 14, 39, 0.9);
      color: #ffffff;
      border: 1px solid rgba(0, 217, 255, 0.35);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(10px);
      font-size: 18px;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .home-btn:hover {
      transform: translateY(-2px);
      background: rgba(10, 14, 39, 0.97);
    }
  </style>
</head>
<body>
  <a href="../games.html" class="home-btn" aria-label="Home" title="Home">🏠</a>
  <div class="matching-game-page">
    <div id="game-wrapper">
      <div id="game">
        <div id="cards">
          <div class="card">
            <div class="face front"></div>
            <div class="face back"></div>
          </div>
        </div>
      </div>
      <section id="popup" class="hide">
        <div id="popup-bg"></div>
        <div id="popup-box">
          <div class="ribbon hide">
            <div class="ribbon-body"><span>New Record</span></div>
            <div class="triangle"></div>
          </div>
          <div id="popup-box-content">
            <h1>You Won!</h1>
            <p>Your Score:</p>
            <p><span class="score">13</span></p>
            <p><small>Last Score: <span class="last-score">20</span><br>
            Saved on: <span class="saved-time">00/00/0000 00:00am</span></small></p>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="matching-game/js/jquery-1.6.min.js"></script>
  <script src="matching-game/js/html5games.matchgame.js"></script>
</body>
</html>
