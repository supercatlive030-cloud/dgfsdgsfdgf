<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>diddys playhouse - Click Here</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .proxy-section { max-width: 1200px; margin: 120px auto 2rem; padding: 0 2rem; }
    .proxy-toolbar { display: flex; gap: 0.75rem; margin: 1.5rem 0; flex-wrap: wrap; }
    .proxy-toolbar input { flex: 1; min-width: 0; padding: 0.9rem 1rem; border: 2px solid rgba(0, 217, 255, 0.25); border-radius: 8px; background: rgba(20, 30, 60, 0.75); color: var(--text-primary); font-size: 1rem; }
    .proxy-toolbar select { padding: 0.9rem 1rem; border: 2px solid rgba(0, 217, 255, 0.25); border-radius: 8px; background: rgba(20, 30, 60, 0.9); color: var(--text-primary); font-size: 1rem; }
    .proxy-toolbar button { border: 0; border-radius: 8px; padding: 0.9rem 1.2rem; background: linear-gradient(135deg, #00d9ff, #3978ff); color: white; font-weight: 700; cursor: pointer; }
    .proxy-mode { display: flex; gap: 0.6rem; margin-top: 1.25rem; }
    .proxy-mode button { border: 1px solid rgba(0, 217, 255, 0.35); border-radius: 8px; padding: 0.65rem 0.9rem; background: rgba(20, 30, 60, 0.7); color: var(--text-primary); cursor: pointer; }
    .proxy-mode button.active { background: rgba(0, 217, 255, 0.2); border-color: #00d9ff; }
    .proxy-frame { width: 100%; height: 65vh; border: 1px solid rgba(0, 217, 255, 0.3); border-radius: 10px; background: white; }
    .proxy-note { color: var(--text-secondary); }
    .proxy-tools, .proxy-sites, .proxy-history { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
    .proxy-tools { margin: 0 0 0.75rem; }
    .proxy-tools button, .proxy-sites button, .proxy-history button { border: 1px solid rgba(0, 217, 255, 0.3); border-radius: 7px; padding: 0.55rem 0.75rem; background: rgba(20, 30, 60, 0.72); color: var(--text-primary); cursor: pointer; }
    .proxy-tools button:hover, .proxy-sites button:hover, .proxy-history button:hover { border-color: #00d9ff; }
    .proxy-sites { margin: 1rem 0; }
    .proxy-sites strong, .proxy-history strong { color: var(--text-primary); margin-right: 0.2rem; }
    .proxy-history { min-height: 2rem; margin: 0.5rem 0 1rem; color: var(--text-secondary); }
    .proxy-status { min-height: 1.3rem; color: var(--text-secondary); }
    @media (max-width: 650px) { .proxy-toolbar { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="background-particles"></div>
  <div class="background-glow"></div>
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo"><span class="logo-icon">⚡</span><span class="logo-text">diddys playhouse</span></div>
      <div class="nav-controls">
        <div class="theme-dropdown"><button class="theme-btn" id="themeBtn" title="Change Theme">🎨</button><div class="theme-menu" id="themeMenu"></div></div>
        <a href="home.html" class="nav-link">🏠 Home</a>
        <a href="games.html" class="nav-link">🎮 Games</a>
        <a href="apps.html" class="nav-link">🧩 Apps</a>
        <a href="proxy.html" class="nav-link">👉 Click Here</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <main class="proxy-section" id="proxyContent" hidden>
    <h1 class="section-title">👉 Click Here</h1>
    <p class="proxy-note">Search several websites or open any direct URL.</p>
    <div class="proxy-mode" role="tablist" aria-label="Proxy mode">
      <button type="button" class="active" id="searchMode">Search websites</button>
      <button type="button" id="directMode">Open direct URL</button>
    </div>
    <form class="proxy-toolbar" id="proxyForm">
      <select id="searchSite" aria-label="Search website">
        <option value="https://www.google.com/search?q=">Google</option>
        <option value="https://www.bing.com/search?q=">Bing</option>
        <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
        <option value="https://search.yahoo.com/search?p=">Yahoo</option>
        <option value="https://www.youtube.com/results?search_query=">YouTube</option>
        <option value="https://en.wikipedia.org/w/index.php?search=">Wikipedia</option>
      </select>
      <input id="proxyUrl" type="search" placeholder="Search the web" autocomplete="off" required />
      <button type="submit" id="proxySubmit">Search</button>
    </form>
    <div class="proxy-sites" aria-label="Popular websites">
      <strong>Quick open:</strong>
      <button type="button" data-site="https://www.youtube.com">▶ YouTube</button>
      <button type="button" data-site="https://www.google.com">Google</button>
      <button type="button" data-site="https://www.wikipedia.org">Wikipedia</button>
      <button type="button" data-site="https://www.reddit.com">Reddit</button>
      <button type="button" data-site="https://github.com">GitHub</button>
      <button type="button" id="favoriteButton" title="Save the current address">☆ Save favorite</button>
    </div>
    <div class="proxy-tools" aria-label="Proxy browser controls">
      <button type="button" id="backButton" title="Go back">← Back</button>
      <button type="button" id="forwardButton" title="Go forward">Forward →</button>
      <button type="button" id="reloadButton" title="Reload current page">↻ Reload</button>
      <button type="button" id="newTabButton" title="Open current page in a new tab">↗ New tab</button>
      <span class="proxy-status" id="proxyStatus" role="status"></span>
    </div>
    <div class="proxy-history" id="proxyHistory" aria-label="Recent proxy searches"></div>
    <iframe id="proxyFrame" class="proxy-frame" title="Proxied website" src="about:blank"></iframe>
  </main>

  <script src="theme.js"></script>
  <script src="auth.js"></script>
  <script>
    const CLICK_HERE_PASSWORD = 'clickhere';
    const CLICK_HERE_UNLOCKED = 'clickHereUnlocked';
    const proxyContent = document.getElementById('proxyContent');

    if (sessionStorage.getItem(CLICK_HERE_UNLOCKED) === 'true') {
      proxyContent.hidden = false;
    } else {
      const password = window.prompt('Enter the password to continue:');
      if (password === CLICK_HERE_PASSWORD) {
        sessionStorage.setItem(CLICK_HERE_UNLOCKED, 'true');
        proxyContent.hidden = false;
      } else {
        window.alert('Incorrect password.');
        window.location.href = 'home.html';
      }
    }

    const proxyForm = document.getElementById('proxyForm');
    const proxyUrl = document.getElementById('proxyUrl');
    const searchSite = document.getElementById('searchSite');
    const proxySubmit = document.getElementById('proxySubmit');
    const searchMode = document.getElementById('searchMode');
    const directMode = document.getElementById('directMode');
    const proxyFrame = document.getElementById('proxyFrame');
    const proxyStatus = document.getElementById('proxyStatus');
    const proxyHistory = document.getElementById('proxyHistory');
    const favoriteButton = document.getElementById('favoriteButton');
    const proxyEndpoint = ['127.0.0.1:5502', 'localhost:5502'].includes(window.location.host)
      ? 'http://localhost:8080/proxy'
      : '/proxy';
    let currentUrl = '';
    const historyItems = JSON.parse(localStorage.getItem('proxyHistory') || '[]');
    const favorites = JSON.parse(localStorage.getItem('proxyFavorites') || '[]');

    function setMode(isSearch) {
      searchMode.classList.toggle('active', isSearch);
      directMode.classList.toggle('active', !isSearch);
      searchSite.hidden = !isSearch;
      proxyUrl.type = isSearch ? 'search' : 'url';
      proxyUrl.placeholder = isSearch ? 'Search the web' : 'https://example.com';
      proxySubmit.textContent = isSearch ? 'Search' : 'Open Website';
    }

    searchMode.addEventListener('click', () => setMode(true));
    directMode.addEventListener('click', () => setMode(false));
    function renderHistory() {
      proxyHistory.replaceChildren();
      if (!historyItems.length) return;
      const label = document.createElement('strong');
      label.textContent = 'Recent:';
      proxyHistory.append(label);
      historyItems.slice(0, 5).forEach((url) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = new URL(url).hostname;
        button.title = url;
        button.addEventListener('click', () => openUrl(url));
        proxyHistory.append(button);
      });
    }
    function openUrl(url) {
      currentUrl = url;
      proxyStatus.textContent = `Loading ${new URL(url).hostname}...`;
      proxyFrame.src = `${proxyEndpoint}?url=${encodeURIComponent(url)}`;
      historyItems.unshift(url);
      historyItems.splice(8);
      localStorage.setItem('proxyHistory', JSON.stringify([...new Set(historyItems)]));
      renderHistory();
      favoriteButton.textContent = favorites.includes(url) ? '★ Saved favorite' : '☆ Save favorite';
    }
    document.querySelectorAll('[data-site]').forEach((button) => {
      button.addEventListener('click', () => openUrl(button.dataset.site));
    });
    proxyForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const value = proxyUrl.value.trim();
      const url = searchSite.hidden ? value : `${searchSite.value}${encodeURIComponent(value)}`;
      openUrl(url);
    });
    favoriteButton.addEventListener('click', () => {
      if (!currentUrl) return;
      const index = favorites.indexOf(currentUrl);
      if (index === -1) favorites.push(currentUrl);
      else favorites.splice(index, 1);
      localStorage.setItem('proxyFavorites', JSON.stringify(favorites));
      favoriteButton.textContent = favorites.includes(currentUrl) ? '★ Saved favorite' : '☆ Save favorite';
    });
    document.getElementById('backButton').addEventListener('click', () => proxyFrame.contentWindow.history.back());
    document.getElementById('forwardButton').addEventListener('click', () => proxyFrame.contentWindow.history.forward());
    document.getElementById('reloadButton').addEventListener('click', () => { proxyStatus.textContent = 'Reloading...'; proxyFrame.contentWindow.location.reload(); });
    document.getElementById('newTabButton').addEventListener('click', () => { if (currentUrl) window.open(`${proxyEndpoint}?url=${encodeURIComponent(currentUrl)}`, '_blank', 'noopener'); });
    proxyFrame.addEventListener('load', () => { proxyStatus.textContent = currentUrl ? `Loaded ${new URL(currentUrl).hostname}` : ''; });
    renderHistory();
  </script>
</body>
</html>
